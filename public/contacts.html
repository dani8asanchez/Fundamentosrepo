<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Daniel Ochoa</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <header>
        <h1>Contacto</h1>
    </header>

   <nav>
     <ul>
        <li><a href="../index.html">Inicio</a></li>
        <li><a href="degree.html">Estudios</a></li> <li><a href="contacts.html">Contacto</a></li>
     </ul>
    </nav>

    <main>
        <section id="contacto">
            <h2>Escríbeme</h2>
            <p>Puedes contactarme a través de este formulario.</p>
            
            <form class="formulario">
                <div class="campo">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>
                </div>

                <div class="campo">
                    <label for="apellido">Apellido:</label>
                    <input type="text" id="apellido" name="apellido" placeholder="Tu apellido" required>
                </div>

                <div class="campo">
                    <label for="tel">Teléfono:</label>
                    <input type="tel" id="tel" name="tel" placeholder="Ej: 600123456">
                </div>

                <div class="campo">
                    <label for="email">Correo electrónico:</label>
                    <input type="email" id="email" name="email" placeholder="tu@email.com" required>
                </div>

                <div class="campo">
                    <label for="mensaje">Mensaje:</label>
                    <textarea id="mensaje" name="mensaje" rows="4" placeholder="¿En qué puedo ayudarte?" required></textarea>
                </div>

                <button type="submit" class="boton-enviar">Enviar Mensaje</button>
            </form>
        </section>
        
        <p><a href="../index.html">Volver al Inicio</a></p>
    </main>
</body>
</html>
